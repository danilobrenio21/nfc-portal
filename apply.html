<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Candidate Application | TW (Phil.) International Manpower Inc.</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans py-8 px-4 flex flex-col justify-center min-h-screen">

  <div class="max-w-2xl mx-auto w-full bg-white border border-slate-200 rounded-2xl shadow-xl p-6 sm:p-8">
    
    <!-- BRAND HEADER -->
    <div class="flex flex-col items-center text-center pb-6 border-b border-slate-100">
      <a href="index.html" class="flex items-center gap-3 mb-2 group">
        <img 
          src="logo.jpg" 
          alt="TW Manpower Logo" 
          class="h-10 sm:h-12 w-auto object-contain" 
          onerror="this.style.display='none'"
        />
        <div class="flex flex-col text-left leading-tight">
          <span class="text-xs sm:text-sm font-black text-blue-950 tracking-tight">
            TW (PHIL.) INTERNATIONAL
          </span>
          <span class="text-[10px] sm:text-xs font-bold text-slate-500 uppercase tracking-wider">
            MANPOWER INC.
          </span>
        </div>
      </a>
      <h1 class="text-2xl font-bold text-slate-900 mt-2">Candidate Pre-Registration</h1>
      <p class="text-xs text-slate-500 mt-1">DMW License: <strong>DMW-051-LB-03202023-R</strong> • Manpower pooling only. No fees collected.</p>
    </div>

    <!-- APPLICATION FORM -->
    <form class="space-y-4 mt-6" onsubmit="event.preventDefault(); alert('Application submitted successfully! TW Manpower recruitment team will review your profile.');">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">First Name</label>
          <input type="text" required placeholder="Juan" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:border-blue-900" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Last Name</label>
          <input type="text" required placeholder="Dela Cruz" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:border-blue-900" />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Mobile Number</label>
          <input type="tel" required placeholder="09171156683" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:border-blue-900" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
          <input type="email" required placeholder="applicant@email.com" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:border-blue-900" />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Preferred Country</label>
          <select class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:outline-none focus:border-blue-900">
            <option>Taiwan</option>
            <option>Japan</option>
            <option>Other Overseas Destinations</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Passport Status</label>
          <select class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:outline-none focus:border-blue-900">
            <option>Valid (More than 2 years)</option>
            <option>Valid (Expiring within 1 year)</option>
            <option>For Renewal / No Passport Yet</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Target Skill / Category</label>
        <select class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:outline-none focus:border-blue-900">
          <option>Factory Machine Operator / Electronics</option>
          <option>Caregiver / Nurse Assistant</option>
          <option>Manufacturing & Assembly</option>
          <option>Agriculture & Food Processing</option>
          <option>Construction & Metal Fabrication</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Upload Resume / CV (Optional)</label>
        <input type="file" class="w-full text-xs text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-900 hover:file:bg-blue-100" />
      </div>

      <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl text-sm transition shadow mt-4 cursor-pointer">
        Submit My Application
      </button>
    </form>

    <div class="text-center mt-6">
      <a href="index.html" class="text-xs text-slate-500 hover:text-slate-800 underline">← Return to Homepage</a>
    </div>
  </div>

</body>
</html>
