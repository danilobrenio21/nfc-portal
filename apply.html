<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Application Form | TW Manpower</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans py-10 px-4">

  <div class="max-w-2xl mx-auto bg-white border border-slate-200 rounded-2xl shadow-xl p-8">
    <div class="text-center pb-6 border-b border-slate-100">
      <a href="index.html" class="text-xl font-black text-blue-900 tracking-tight">
        TW <span class="text-red-600">MANPOWER</span>
      </a>
      <h1 class="text-2xl font-bold text-slate-900 mt-2">Official Candidate Pre-Registration</h1>
      <p class="text-xs text-slate-500 mt-1">Please provide accurate information for background evaluation.</p>
    </div>

    <form class="space-y-4 mt-6" onsubmit="event.preventDefault(); alert('Application submitted successfully! Our recruitment team will review your CV.');">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">First Name</label>
          <input type="text" required placeholder="Juan" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-blue-900" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Last Name</label>
          <input type="text" required placeholder="Dela Cruz" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-blue-900" />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Mobile Contact Number</label>
          <input type="tel" required placeholder="09171234567" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-blue-900" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
          <input type="email" required placeholder="juan@email.com" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-blue-900" />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Passport Status</label>
          <select class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:outline-blue-900">
            <option>Valid (More than 2 years)</option>
            <option>Valid (Expiring within 1 year)</option>
            <option>For Renewal / No Passport Yet</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Japanese Language Level</label>
          <select class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:outline-blue-900">
            <option>No Japanese Background</option>
            <option>Basic / Studying (N5 Level)</option>
            <option>JLPT N4 / JFT-Basic Certified</option>
            <option>JLPT N3 / N2 / N1 Passer</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Target Skill / Category</label>
        <select class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:outline-blue-900">
          <option>Caregiver / Nurse</option>
          <option>Manufacturing & Factory Work</option>
          <option>Agriculture & Farming</option>
          <option>Construction & Welding</option>
          <option>Hotel & Food Service</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Upload Resume / CV (PDF or DOC)</label>
        <input type="file" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-900 hover:file:bg-blue-100" />
      </div>

      <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl text-sm transition shadow mt-4">
        Submit My Application
      </button>
    </form>

    <div class="text-center mt-6">
      <a href="index.html" class="text-xs text-slate-500 hover:text-slate-800 underline">← Return to Homepage</a>
    </div>
  </div>

</body>
</html>
